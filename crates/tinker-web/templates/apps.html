<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Apps — {{ host_name }}</title>
<link rel="stylesheet" href="/assets/tinker.css" />
</head>
<body>
<header class="app-header">
  <span class="brand">{{ host_name }}</span>
  <h1>Apps</h1>
  <span class="version">{{ org_slug }}</span>
</header>
<main style="max-width: 48rem; margin: 2rem auto; padding: 0 1rem;">
  <ul>
  {% for app in apps %}
    <li><a href="/apps/{{ app.slug }}">{{ app.name }}</a> <span class="version">{{ app.version }}</span></li>
  {% endfor %}
  </ul>
  <form method="post" action="/logout"><button type="submit">Sign out</button></form>
</main>
</body>
</html>
