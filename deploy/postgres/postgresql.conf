# tinker-postgres production configuration (PostgreSQL 18; validated
# 2026-09-30: a scratch 18.6 cluster started on this file with all 47
# settings accepted, archive_mode on, log_connections = on still valid)
#
# This file is the PRODUCTION counterpart of the dev cluster that
# bin/pg-ensure.sh builds. See CONFIG-DELTA.md for the exact
# differences, and initdb-and-bootstrap.md for provisioning.
#
# SIZING ASSUMPTIONS (re-tune for the real host):
#   dedicated VM, 4 vCPU, 8 GB RAM, SSD storage.
#   shared_buffers / effective_cache_size / work_mem / maintenance_work_mem
#   are the four knobs the operator MUST revisit for a different host.
#
# Install: copy to the cluster data dir as postgresql.conf (or include
# from it: `include = '/etc/postgresql/tinker/postgresql.conf'`), then
# `SELECT pg_reload_conf()` for the marked [reload] parameters; the rest
# need a restart.

# ------------------------------------------------------------------
# Connections [restart]
# ------------------------------------------------------------------
listen_addresses = 'localhost'          # TLS terminates at the reverse
                                        # proxy; tinker-mcp runs on the
                                        # same host. If the DB is ever on
                                        # a different host, change this
                                        # AND set ssl = on with real certs
                                        # (operator provides — see README).
port = 5432
max_connections = 100
superuser_reserved_connections = 3
unix_socket_directories = '/var/run/postgresql'

# ------------------------------------------------------------------
# Memory [restart for shared_buffers; rest are reload]
# ------------------------------------------------------------------
shared_buffers = 2GB                   # ~25% of RAM on a dedicated DB host
effective_cache_size = 6GB            # ~75% of RAM: planner hint only
work_mem = 8MB                        # per-sort/hash op; 100 conns * 8MB
maintenance_work_mem = 512MB          # VACUUM / CREATE INDEX
wal_buffers = 32MB                    # auto-tuned from shared_buffers; explicit

# ------------------------------------------------------------------
# WAL: archive-ready (the R2 DR runbook governs the off-host copy)
# ------------------------------------------------------------------
wal_level = replica                   # [restart] minimum for WAL archiving
                                      # and streaming replication
archive_mode = on                     # [restart]
archive_command = 'test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f'
                                      # [reload] Stages every completed WAL
                                      # segment into the local archive
                                      # spool. The R2 DR runbook moves the
                                      # spool OFF-HOST (the local spool is
                                      # NOT a backup by itself). `test ! -f`
                                      # keeps the command idempotent across
                                      # retries — never overwrite an
                                      # archived segment.
archive_timeout = 3600                # force a segment switch hourly so the
                                      # recovery point never goes stale on a
                                      # quiet database
max_wal_size = 4GB                    # [reload]
min_wal_size = 1GB                    # [reload]
checkpoint_completion_target = 0.9    # [reload] spread checkpoints out
max_wal_senders = 3                   # [reload] replication-ready even with
wal_keep_size = 512MB                 # [reload] no standby attached yet

# ------------------------------------------------------------------
# Planner cost model (SSD) [reload]
# ------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# ------------------------------------------------------------------
# Logging: collector ON, rotated, slow-query aware
# ------------------------------------------------------------------
log_destination = 'stderr'            # [reload]
logging_collector = on                # [restart] dev leaves this OFF and
                                      # logs to a single file; prod rotates
log_directory = 'log'                 # [reload] relative to the data dir
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'   # [reload]
log_file_mode = 0600                  # [reload]
log_rotation_age = 1d                 # [reload]
log_rotation_size = 100MB             # [reload]
log_truncate_on_rotation = off        # [reload]
log_min_duration_statement = 1000     # [reload] log queries slower than 1s
log_checkpoints = on                  # [reload]
log_connections = on                  # [reload]
log_disconnections = on               # [reload]
log_lock_waits = on                   # [reload]
log_temp_files = 10240                # [reload] log temp files > 10MB
log_autovacuum_min_duration = 1000    # [reload]

# ------------------------------------------------------------------
# Autovacuum: on, slightly more aggressive than defaults [reload]
# ------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ------------------------------------------------------------------
# Security defaults
# ------------------------------------------------------------------
password_encryption = 'scram-sha-256' # [reload] matches pg-ensure.sh initdb
ssl = off                             # [restart] localhost-only traffic.
                                      # Turn ON with ssl_cert_file /
                                      # ssl_key_file if clients ever
                                      # connect over a network.

# ------------------------------------------------------------------
# Locale / misc (set at initdb; repeated here for documentation)
# ------------------------------------------------------------------
# initdb -E UTF8 --locale=C.UTF-8
datestyle = 'iso, mdy'                # [reload]
timezone = 'UTC'                      # [reload] store UTC; present in the app
log_timezone = 'UTC'                  # [reload]
