# Sample nginx reverse proxy: TLS termination in front of
# `tinker-mcp serve` (item 46).
#
# Replace every __PLACEHOLDER__ before use. Install: copy to
# /etc/nginx/sites-available/tinker-mcp, symlink into sites-enabled,
# `nginx -t`, `systemctl reload nginx`.
#
# Assumes: tinker-mcp serve --bind 127.0.0.1:8080 (see
# deploy/systemd/tinker-mcp.service). Certificates: Let's Encrypt via
# certbot (see deploy/README.md "What you must provide").
#
# SYNTAX VALIDATION: NOT validated with `nginx -t` in this environment
# (nginx is not installed on the build VM). Marked UNVALIDATED — the
# operator must run `nginx -t` after filling in the placeholders.

upstream tinker_mcp {
    # Single instance today. When a second host exists, add it here and
    # sessions keep working: MCP sessions are in-process per instance,
    # so use ip_hash or a shared session store before adding backends.
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Defense in depth: the app authenticates every request with C6 Bearer
# keys; the proxy adds a coarse per-IP ceiling so one client cannot
# drown the JSON-RPC endpoint.
limit_req_zone $binary_remote_addr zone=mcp:10m rate=20r/s;

server {
    listen 80;
    server_name __DOMAIN__;
    # ACME challenge must stay reachable over HTTP for certbot.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     __TLS_CERT_PATH__;   # e.g. /etc/letsencrypt/live/__DOMAIN__/fullchain.pem
    ssl_certificate_key __TLS_KEY_PATH__;    # e.g. /etc/letsencrypt/live/__DOMAIN__/privkey.pem
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # Mozilla intermediate (2026): ECDHE first, no RSA key exchange.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # HSTS: only enable the includeSubDomains+preload form once ALL
    # subdomains are HTTPS. Start with the plain form below.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Security headers (API surface: no framing, no MIME sniffing).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # No Server version leak.
    server_tokens off;

    # JSON-RPC bodies are small; cap them so a giant body cannot tie up
    # the JSON parser.
    client_max_body_size 1m;

    access_log /var/log/nginx/tinker-mcp.access.log combined;
    error_log  /var/log/nginx/tinker-mcp.error.log warn;

    # --- liveness: unauthenticated, information-minimal ---------------
    # The load balancer hits this; it carries no credentials and the
    # app answers {"status":"ok","version":"..."} with nothing else.
    location = /healthz {
        proxy_pass http://tinker_mcp;
        proxy_http_version 1.1;
        access_log /var/log/nginx/tinker-mcp.health.log combined;
    }

    # --- MCP JSON-RPC --------------------------------------------------
    location /mcp {
        limit_req zone=mcp burst=40 nodelay;
        proxy_pass http://tinker_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app mints session ids in the Mcp-Session-Id response
        # header; strip hop-by-hop headers but pass everything else
        # through untouched — especially Authorization.
        proxy_pass_request_headers on;
        # SSE (/mcp/stream): no buffering, long-lived connection.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        # Keep the upstream keepalive pool working.
        proxy_set_header Connection "";
    }

    # Everything else: the app already returns a teaching 404, but the
    # proxy should not forward scans to it. Deny loudly at the edge.
    location / {
        return 404 '{"error":"not_found","message":"unknown route"}';
        add_header Content-Type application/json always;
    }
}
