# tinker-redis production configuration (Redis 7.0)
#
# Role in Tinker: live session store (tinker-transfer sessions) and the
# tinker-web signal bus (TINKER_REDIS_URL). Session loss on restart is
# user-visible (forced logouts), so persistence is RDB *snapshots* plus
# an AOF *log* — the combination the R2 DR drills validated: RDB gives
# compact point-in-time images for restore, AOF (everysec) bounds the
# loss window to ~1s of writes.
#
# Install: copy to /etc/redis/tinker-redis.conf (or pass the path to
# redis-server directly). The systemd unit in this directory starts it.
# Placeholders __LIKE_THIS__ must be replaced by the operator.

# --- network ---------------------------------------------------------
bind 127.0.0.1 ::1
port 6379
protected-mode yes
# No TLS here: redis only listens on loopback; external clients never
# reach it. If redis ever leaves the host, enable tls-port instead.
tcp-backlog 511
timeout 0
tcp-keepalive 300

# --- auth ------------------------------------------------------------
# The password lives in the operator's secret store and MUST match the
# password embedded in TINKER_REDIS_URL (see deploy/env/).
requirepass __REDIS_PASSWORD__

# --- persistence: RDB + AOF ------------------------------------------
dir /var/lib/redis
dbfilename dump.rdb
# Snapshot when the write volume justifies it; AOF is the primary
# durability story, RDB is the fast-restore image.
save 3600 1
save 300 100
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
# everysec: at most ~1s of writes lost on a crash. `always` would halve
# throughput for a session store that does not need it; `no` could lose
# 30s+ — neither was acceptable in the R2 drills.

# --- memory ----------------------------------------------------------
# Sessions are small but numerous; cap redis well below the host's RAM
# so a session flood cannot OOM the database next door. SIZED FOR an
# 8GB host — re-tune for the real machine.
maxmemory 1gb
maxmemory-policy noeviction
# noeviction: session writes FAIL LOUDLY when full instead of silently
# evicting somebody else's session (volatile-lru would log users out
# at random). Full redis is an operator alert, not a silent behavior.

# --- durability knobs -------------------------------------------------
# systemd manages the process (daemonize no). supervised auto lets
# redis notify systemd on readiness.
daemonize no
supervised auto
pidfile /var/run/redis/tinker-redis.pid
logfile /var/log/redis/tinker-redis.log
loglevel notice

# --- security --------------------------------------------------------
# No modules, no DEBUG commands over the wire in production.
enable-debug-command no
# Rename the dangerous commands; the operator un-renames them only for
# break-glass maintenance (keep the new names in the secret store).
rename-command FLUSHDB __RENAMED_FLUSHDB__
rename-command FLUSHALL __RENAMED_FLUSHALL__
rename-command DEBUG __RENAMED_DEBUG__
# Least privilege on the data dir is enforced by the systemd unit
# (ReadWritePaths); redis itself runs as the `redis` user. AUTH uses the
# `requirepass` above (default user); no extra ACL users are defined so
# there is exactly one credential to rotate.
